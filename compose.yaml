name: ${COMPOSE_PROJECT_NAME:-movprompt-local}

x-api-image: &api-image
  image: ${COMPOSE_PROJECT_NAME:-movprompt-local}-api:local
  build:
    context: .
    dockerfile: Dockerfile.api

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-movprompt}"
      POSTGRES_USER: "${POSTGRES_USER:-movprompt}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-movprompt-local-only}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-movprompt-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-movprompt-local-secret}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}"
      # The health probe uses this named mc host before minio-init runs.
      MC_HOST_local: "http://${MINIO_ROOT_USER:-movprompt-local}:${MINIO_ROOT_PASSWORD:-movprompt-local-secret}@127.0.0.1:9000"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      backend:
        aliases:
          # Browsers resolve *.localhost to loopback while Docker DNS resolves
          # this alias to MinIO, so generated signed URLs work on both sides.
          - minio.localhost

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-movprompt-local}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-movprompt-local-secret}"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/creator-assets
        mc mb --ignore-existing local/creator-outputs
        mc mb --ignore-existing local/template-previews
        mc anonymous set none local/creator-assets
        mc anonymous set none local/creator-outputs
        mc anonymous set none local/template-previews
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "${MAILPIT_MAX_MESSAGES:-500}"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - backend

  migrate:
    <<: *api-image
    profiles: ["application"]
    restart: "no"
    command: ["bun", "run", "--cwd", "packages/db", "migrate"]
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DATABASE_URL_DIRECT: "postgresql://${POSTGRES_USER:-movprompt}:${POSTGRES_PASSWORD:-movprompt-local-only}@postgres:5432/${POSTGRES_DB:-movprompt}"
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "1"
      DATABASE_APPLICATION_NAME: movprompt-local-migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *api-image
    profiles: ["application"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_ENV: "${APP_ENV:-local}"
      APP_VERSION: "${APP_VERSION:-0.1.0-local}"
      COMMIT_SHA: "${COMMIT_SHA:-local}"
      API_PORT: "3000"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-http://localhost:8080}"
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:8080}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      FEATURE_AUTHENTICATION: "${FEATURE_AUTHENTICATION:-true}"
      FEATURE_ASSETS: "${FEATURE_ASSETS:-true}"
      FEATURE_TEMPLATE_MODE: "${FEATURE_TEMPLATE_MODE:-true}"
      FEATURE_ADVANCED_MODE: "${FEATURE_ADVANCED_MODE:-true}"
      FEATURE_GENERATION: "${FEATURE_GENERATION:-false}"
      GENERATION_PRICING_VERSION: "${GENERATION_PRICING_VERSION:-}"
      GENERATION_QUOTE_TTL_SECONDS: "${GENERATION_QUOTE_TTL_SECONDS:-}"
      GENERATION_STARTER_ONLY: "${GENERATION_STARTER_ONLY:-true}"
      GENERATION_VIDEO_CINEMATIC_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND:-}"
      GENERATION_IMAGE_PRODUCT_CREDITS_PER_IMAGE: "${GENERATION_IMAGE_PRODUCT_CREDITS_PER_IMAGE:-}"
      FEATURE_EXPORTS: "${FEATURE_EXPORTS:-false}"
      FEATURE_BILLING: "${FEATURE_BILLING:-false}"
      DATABASE_URL_POOLED: "postgresql://movprompt_api:movprompt-api-local-only@postgres:5432/${POSTGRES_DB:-movprompt}"
      DATABASE_URL_DIRECT: "postgresql://movprompt_api:movprompt-api-local-only@postgres:5432/${POSTGRES_DB:-movprompt}"
      DATABASE_SSL: "false"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:8787}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-movprompt-local-only-better-auth-secret-change-me}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      APPLE_APP_BUNDLE_IDENTIFIER: "${APPLE_APP_BUNDLE_IDENTIFIER:-}"
      EMAIL_FROM: "${EMAIL_FROM:-MovPrompt <no-reply@localhost>}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      S3_ENDPOINT: "${S3_DOCKER_ENDPOINT:-http://minio.localhost:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-movprompt-local}"
      S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-movprompt-local-secret}"
      S3_FORCE_PATH_STYLE: "true"
      S3_ASSETS_BUCKET: creator-assets
      S3_OUTPUTS_BUCKET: creator-outputs
      S3_PREVIEWS_BUCKET: template-previews
      S3_UPLOAD_URL_TTL_SECONDS: "${S3_UPLOAD_URL_TTL_SECONDS:-900}"
      S3_DOWNLOAD_URL_TTL_SECONDS: "${S3_DOWNLOAD_URL_TTL_SECONDS:-900}"
      PROVIDER_OUTPUT_ALLOWED_HOSTS: "${PROVIDER_OUTPUT_ALLOWED_HOSTS:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      VERCEL_AI_GATEWAY_BASE_URL: "${VERCEL_AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v4/ai}"
      VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER: "${VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER:-720p}"
      MOVPROMPT_QUALITY_MODEL_ID: "${MOVPROMPT_QUALITY_MODEL_ID:-google/gemini-3.6-flash}"
      VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO: "${VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO:-false}"
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: "${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-45}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      FFPROBE_PATH: "${FFPROBE_PATH:-ffprobe}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID:-}"
      MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY: "${MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY:-false}"
      MOVPROMPT_PROVIDER_BYTEPLUS_READY: "${MOVPROMPT_PROVIDER_BYTEPLUS_READY:-false}"
    ports:
      - "127.0.0.1:${API_PORT:-8787}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
    networks:
      - backend

  worker:
    profiles: ["application"]
    image: ${COMPOSE_PROJECT_NAME:-movprompt-local}-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      APP_ENV: "${APP_ENV:-local}"
      APP_VERSION: "${APP_VERSION:-0.1.0-local}"
      FEATURE_GENERATION: "${FEATURE_GENERATION:-false}"
      GENERATION_PRICING_VERSION: "${GENERATION_PRICING_VERSION:-}"
      GENERATION_QUOTE_TTL_SECONDS: "${GENERATION_QUOTE_TTL_SECONDS:-}"
      GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_CINEMATIC_720P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_480P_CREDITS_PER_SECOND:-}"
      GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND: "${GENERATION_VIDEO_PRODUCT_FIDELITY_720P_CREDITS_PER_SECOND:-}"
      DATABASE_URL_DIRECT: "postgresql://movprompt_worker:movprompt-worker-local-only@postgres:5432/${POSTGRES_DB:-movprompt}"
      WORKER_ID: "${WORKER_ID:-movprompt-local-worker}"
      WORKER_SMOKE_TEST_ON_START: "${WORKER_SMOKE_TEST_ON_START:-true}"
      WORKER_OUTBOX_BATCH_SIZE: "${WORKER_OUTBOX_BATCH_SIZE:-20}"
      WORKER_OUTBOX_LEASE_MS: "${WORKER_OUTBOX_LEASE_MS:-60000}"
      WORKER_OUTBOX_POLL_INTERVAL_MS: "${WORKER_OUTBOX_POLL_INTERVAL_MS:-1000}"
      WORKER_RENDER_RECONCILIATION_DELAY_SECONDS: "${WORKER_RENDER_RECONCILIATION_DELAY_SECONDS:-15}"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}"
      S3_ENDPOINT: "${S3_DOCKER_ENDPOINT:-http://minio.localhost:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-movprompt-local}"
      S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-movprompt-local-secret}"
      S3_FORCE_PATH_STYLE: "true"
      S3_ASSETS_BUCKET: creator-assets
      S3_OUTPUTS_BUCKET: creator-outputs
      S3_PREVIEWS_BUCKET: template-previews
      S3_UPLOAD_URL_TTL_SECONDS: "${S3_UPLOAD_URL_TTL_SECONDS:-900}"
      S3_DOWNLOAD_URL_TTL_SECONDS: "${S3_DOWNLOAD_URL_TTL_SECONDS:-900}"
      PROVIDER_OUTPUT_ALLOWED_HOSTS: "${PROVIDER_OUTPUT_ALLOWED_HOSTS:-}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      VERCEL_AI_GATEWAY_BASE_URL: "${VERCEL_AI_GATEWAY_BASE_URL:-https://ai-gateway.vercel.sh/v4/ai}"
      VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER: "${VERCEL_GATEWAY_SEEDANCE_RESOLUTION_TIER:-720p}"
      VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO: "${VERCEL_GATEWAY_SEEDANCE_GENERATE_AUDIO:-false}"
      BYTEPLUS_ARK_API_KEY: "${BYTEPLUS_ARK_API_KEY:-}"
      BYTEPLUS_ARK_BASE_URL: "${BYTEPLUS_ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}"
      BYTEPLUS_CALLBACK_URL: "${BYTEPLUS_CALLBACK_URL:-}"
      BYTEPLUS_SEEDANCE_RESOLUTION: "${BYTEPLUS_SEEDANCE_RESOLUTION:-1080p}"
      BYTEPLUS_SEEDANCE_GENERATE_AUDIO: "${BYTEPLUS_SEEDANCE_GENERATE_AUDIO:-false}"
      AZURE_SPEECH_KEY: "${AZURE_SPEECH_KEY:-}"
      AZURE_SPEECH_REGION: "${AZURE_SPEECH_REGION:-}"
      AZURE_SPEECH_KUWAITI_VOICE: "${AZURE_SPEECH_KUWAITI_VOICE:-ar-KW-NouraNeural}"
      AZURE_SPEECH_ENGLISH_VOICE: "${AZURE_SPEECH_ENGLISH_VOICE:-en-US-AvaMultilingualNeural}"
      FFPROBE_PATH: "${FFPROBE_PATH:-ffprobe}"
      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      MOVPROMPT_QUALITY_MODEL_ID: "${MOVPROMPT_QUALITY_MODEL_ID:-google/gemini-3.6-flash}"
      MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY: "${MOVPROMPT_PROVIDER_VERCEL_GATEWAY_READY:-false}"
      MOVPROMPT_PROVIDER_BYTEPLUS_READY: "${MOVPROMPT_PROVIDER_BYTEPLUS_READY:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_CINEMATIC_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID: "${MOVPROMPT_CAPABILITY_VIDEO_PRODUCT_FIDELITY_MODEL_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ENABLED:-false}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_ADAPTER_ID:-}"
      MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID: "${MOVPROMPT_CAPABILITY_IMAGE_PRODUCT_MODEL_ID:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 40s
    networks:
      - backend

volumes:
  postgres-data:
  minio-data:
  mailpit-data:

networks:
  backend:
    driver: bridge
